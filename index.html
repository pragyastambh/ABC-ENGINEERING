<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ABC Engineering | CAD Services</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="brand">ABC Engineering</div>
  <nav>
    <a href="#home">Home</a><a href="#services">Services</a><a href="#contact">Contact</a>
    <button class="btn" onclick="showLogin('customer')">Customer Login</button>
    <button class="btn btn-dark" onclick="showLogin('admin')">Admin</button>
  </nav>
</header>

<main>
<section id="home" class="hero panel">
  <h1>Mechanical CAD Drawing Services</h1>
  <p>Professional equipment, fabrication, assembly and engineering drawing support.</p>
</section>

<section id="services" class="panel">
  <div class="section-title"><h2>Our Services</h2></div>
  <div id="publicServices" class="grid"></div>
</section>

<section id="contact" class="panel">
  <h2>Contact</h2>
  <p>ABC Engineering</p>
  <p>Contact details can be configured later from Admin Settings.</p>
</section>
</main>

<div id="loginModal" class="modal hidden">
  <div class="modal-box">
    <button class="close" onclick="hideLogin()">×</button>
    <h2 id="loginTitle">Customer Login</h2>
    <form id="loginForm">
      <label>Email</label>
      <input id="loginEmail" type="email" required>
      <label>4-Digit Access Number</label>
      <input id="loginAccess" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required>
      <button class="btn btn-primary full" type="submit">LOGIN</button>
    </form>
    <p id="loginMessage" class="message"></p>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
